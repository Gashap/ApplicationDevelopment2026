openapi: 3.0.3
info:
  title: Habit Tracker API
  version: 1.0.0
  description: |
    API трекера привычек: пользователь заводит привычки, смотрит их список,
    правит и удаляет. Подход API first — сначала контракт, потом код.

    Правило контракта: метод = намерение · статус = результат · форма = DTO.
    Внутренние поля сущности (ownerId, служебные флаги, даты удаления)
    наружу не отдаются — клиент видит только схемы из components.

    Ошибки доступа:
    * **401** — «не знаю, кто ты»: нет токена или он недействителен;
    * **403** — «знаю — нельзя»: токен в порядке, но привычка чужая.
servers:
  - url: http://localhost:8080
    description: Локальный запуск сгенерированного сервиса
tags:
  - name: habits
    description: Привычки текущего пользователя
security:
  - bearerAuth: []

paths:
  /api/habits:
    get:
      tags: [habits]
      operationId: listHabits
      summary: Список привычек текущего пользователя
      description: Возвращает страницу привычек. Можно отфильтровать по статусу.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница привычек
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [habits]
      operationId: createHabit
      summary: Создать привычку
      description: |
        Создаёт новую привычку. POST не идемпотентен: два одинаковых запроса
        создадут две привычки.
      requestBody:
        required: true
        x-body-name: new_habit_request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewHabitRequest'
      responses:
        '201':
          description: Привычка создана
          headers:
            Location:
              description: Адрес созданной привычки
              schema:
                type: string
                example: /api/habits/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/habits/{habitId}:
    parameters:
      - $ref: '#/components/parameters/HabitId'
    get:
      tags: [habits]
      operationId: getHabit
      summary: Получить одну привычку
      responses:
        '200':
          description: Привычка найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [habits]
      operationId: updateHabit
      summary: Изменить часть полей привычки
      description: |
        Частичное обновление: меняются только переданные поля.
        Например, тело только с полем status = ARCHIVED отправит привычку в архив.
      requestBody:
        required: true
        x-body-name: habit_patch_request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitPatchRequest'
      responses:
        '200':
          description: Привычка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [habits]
      operationId: deleteHabit
      summary: Удалить привычку
      description: "DELETE идемпотентен: повторный вызов вернёт 404, состояние не изменится."
      responses:
        '204':
          description: Привычка удалена, тела ответа нет
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Токен пользователя в заголовке `Authorization: Bearer <token>`"

  parameters:
    HabitId:
      name: habitId
      in: path
      required: true
      description: Идентификатор привычки
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 42
    StatusFilter:
      name: status
      in: query
      required: false
      description: Показать только активные или только архивные привычки
      schema:
        $ref: '#/components/schemas/HabitStatus'
    Limit:
      name: limit
      in: query
      required: false
      description: Сколько привычек вернуть на странице
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Сколько привычек пропустить от начала списка
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Некорректный запрос — тело или параметры не прошли проверку контракта
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: "Поле title обязательно и не может быть пустым"
    Unauthorized:
      description: Не знаю, кто ты — токен не передан, просрочен или недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: "Требуется авторизация"
    Forbidden:
      description: Знаю, кто ты, но нельзя — привычка принадлежит другому пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: "Нет доступа к этой привычке"
    NotFound:
      description: Привычки с таким id нет (или она уже удалена)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: "Привычка 42 не найдена"

  schemas:
    HabitStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
      description: ACTIVE — привычка отслеживается, ARCHIVED — убрана в архив

    Frequency:
      type: string
      enum: [DAILY, WEEKLY]
      description: Как часто нужно выполнять привычку

    NewHabitRequest:
      type: object
      description: Контракт входа для создания привычки — то, что клиент обязан принести
      required: [title, frequency]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: Читать 20 минут
        description:
          type: string
          maxLength: 500
          example: Перед сном, бумажная книга
        frequency:
          $ref: '#/components/schemas/Frequency'
        targetPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Сколько раз в неделю (для WEEKLY)
          example: 5

    HabitPatchRequest:
      type: object
      description: Частичное обновление — все поля необязательны, но хотя бы одно нужно передать
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        frequency:
          $ref: '#/components/schemas/Frequency'
        targetPerWeek:
          type: integer
          minimum: 1
          maximum: 7
        status:
          $ref: '#/components/schemas/HabitStatus'

    HabitView:
      type: object
      description: |
        Контракт выхода — то, что клиент видит о привычке.
        Внутренние поля сущности (ownerId, deletedAt, служебные флаги
        напоминаний) сюда намеренно не входят.
      required: [id, title, frequency, status, currentStreak, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        title:
          type: string
          example: Читать 20 минут
        description:
          type: string
          example: Перед сном, бумажная книга
        frequency:
          $ref: '#/components/schemas/Frequency'
        targetPerWeek:
          type: integer
          example: 5
        status:
          $ref: '#/components/schemas/HabitStatus'
        currentStreak:
          type: integer
          minimum: 0
          description: Сколько периодов подряд привычка выполнена
          example: 3
        createdAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'

    HabitPage:
      type: object
      description: Страница списка привычек
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HabitView'
        total:
          type: integer
          description: Сколько всего привычек подходит под фильтр
          example: 7
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    ApiError:
      type: object
      description: Ошибка — тоже DTO, одинаковой формы для всех кодов 4xx
      required: [message]
      properties:
        message:
          type: string
          example: Привычка 42 не найдена
